name: ${COMPOSE_PROJECT_NAME:-influence-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"
    labels: "com.docker.compose.service"

x-service-labels: &service-labels
  com.influenceth.stack.environment: ${STACK_ENVIRONMENT:-production}
  com.influenceth.stack.project: ${COMPOSE_PROJECT_NAME:-influence-production}

x-app-environment: &app-environment
  NODE_ENV: ${STACK_ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HEALTH_NAMESPACE: ${HEALTH_NAMESPACE:-${STACK_ENVIRONMENT:-production}}
  HEALTH_TIMEOUT_MS: ${HEALTH_TIMEOUT_MS:-2000}
  WORKER_MAX_AGE_MS: ${WORKER_MAX_AGE_MS:-180000}
  MONGO_URL_FILE: /run/secrets/mongo_url
  REDIS_URL_FILE: /run/secrets/redis_url
  ELASTICSEARCH_URL_FILE: /run/secrets/elasticsearch_url
  ETHEREUM_PROVIDER_FILE: /run/secrets/alchemy_influence_ethereum_http_url
  REDIS_DISABLE_TLS: "1"
  STARKNET_RPC_PROVIDER: http://juno:6060/${JUNO_RPC_VERSION:-v0_10}
  STARKNET_EVENT_RETRIEVER_RPC_PROVIDER: http://juno:6060/${JUNO_RPC_VERSION:-v0_10}

x-app-base: &app-base
  image: ${INFLUENCE_SERVER_IMAGE:-ghcr.io/adaliafoundation/influence-server:production}
  restart: unless-stopped
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment: *app-environment
  secrets:
    - mongo_url
    - redis_url
    - elasticsearch_url
    - alchemy_influence_ethereum_http_url
  networks:
    - data
    - outbound
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  mem_limit: ${APP_MEMORY_LIMIT:-1536m}
  cpus: ${APP_CPU_LIMIT:-1.5}
  pids_limit: ${APP_PIDS_LIMIT:-256}
  logging: *default-logging
  labels: *service-labels

x-app-health: &app-health
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 180s

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648}
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/influencedata}/caddy-data:/data
      - ${DATA_ROOT:-/influencedata}/caddy-config:/config
    networks:
      - edge
    depends_on:
      influence-server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CADDY_MEMORY_LIMIT:-512m}
    cpus: ${CADDY_CPU_LIMIT:-1}
    pids_limit: ${CADDY_PIDS_LIMIT:-128}
    logging: *default-logging
    labels:
      <<: *service-labels
      com.influenceth.stack.component: edge

  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0.41@sha256:8102f674c3d5b5c3b5a248397778b8d148a998c6409f390ff62628eb617f0847}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/influence-stack/mongo-entrypoint.sh"]
    command: ["mongod"]
    tmpfs:
      - /run/mongo-secrets:size=1m,mode=0700
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-influence_admin}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/mongo-secrets/mongo_root_password
      MONGO_APP_PASSWORD_FILE: /run/mongo-secrets/mongo_app_password
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-influence}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-influence}
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - ./scripts/mongo-entrypoint.sh:/opt/influence-stack/mongo-entrypoint.sh:ro
      - ${DATA_ROOT:-/influencedata}/mongodb-data:/data/db
      - ./scripts/mongo-init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$$(cat /run/mongo-secrets/mongo_root_password)"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MONGO_MEMORY_LIMIT:-8g}
    cpus: ${MONGO_CPU_LIMIT:-4}
    pids_limit: ${MONGO_PIDS_LIMIT:-512}
    labels:
      <<: *service-labels
      com.influenceth.stack.component: mongodb

  redis:
    image: ${REDIS_IMAGE:-redis:7.2.16-alpine@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed}
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - ${DATA_ROOT:-/influencedata}/redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: ${REDIS_MEMORY_LIMIT:-4g}
    cpus: ${REDIS_CPU_LIMIT:-2}
    pids_limit: ${REDIS_PIDS_LIMIT:-256}
    labels:
      <<: *service-labels
      com.influenceth.stack.component: redis

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.19.20@sha256:e4797708584bd0df7c746b33a6640d243018a0ae8c8b088391c6f4675a3bef52}
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/influence-stack/elasticsearch-entrypoint.sh"]
    command: ["eswrapper"]
    tmpfs:
      - /run/elasticsearch-secrets:size=1m,mode=0700
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD_FILE: /run/elasticsearch-secrets/elasticsearch_password
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms2g -Xmx2g}
    secrets:
      - elasticsearch_password
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./scripts/elasticsearch-entrypoint.sh:/opt/influence-stack/elasticsearch-entrypoint.sh:ro
      - ${DATA_ROOT:-/influencedata}/elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$(cat /run/elasticsearch-secrets/elasticsearch_password)\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    mem_limit: ${ELASTICSEARCH_MEMORY_LIMIT:-6g}
    cpus: ${ELASTICSEARCH_CPU_LIMIT:-4}
    pids_limit: ${ELASTICSEARCH_PIDS_LIMIT:-1024}
    labels:
      <<: *service-labels
      com.influenceth.stack.component: elasticsearch

  juno:
    extends:
      file: compose.juno.yaml
      service: juno

  influence-server:
    <<: *app-base
    command: ["node", "src/api/server.js"]
    environment:
      <<: *app-environment
      API_SERVER: ${API_SERVER:-1}
      IMAGES_SERVER: ${IMAGES_SERVER:-1}
      PORT: ${PORT:-3001}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL}
      IMAGES_SERVER_URL: ${IMAGES_SERVER_URL:?Set IMAGES_SERVER_URL}
      ENV_CHECK_ENABLED: ${ENV_CHECK_ENABLED:-1}
      ELEMENT_CHAIN: ${ELEMENT_CHAIN:-starknet}
      SENDGRID_SENDER: ${SENDGRID_SENDER:-}
      SENDGRID_TEMPLATE_NOTIFICATION: ${SENDGRID_TEMPLATE_NOTIFICATION:-}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-0}
      NOTIFICATIONS_EMAIL_FROM_EMAIL: ${NOTIFICATIONS_EMAIL_FROM_EMAIL:-}
      NOTIFICATIONS_EMAIL_FROM_NAME: ${NOTIFICATIONS_EMAIL_FROM_NAME:-Influence Notifications}
      STARTER_PACK_PROVISIONER_ENABLED: ${STARTER_PACK_PROVISIONER_ENABLED:-0}
      CREWMATE_PROVISIONER_ENABLED: ${CREWMATE_PROVISIONER_ENABLED:-0}
      STARKNET_STARTER_PACK_ADMIN: ${STARKNET_STARTER_PACK_ADMIN:-}
      STRIPE_CREWMATE_PRODUCT_ID: ${STRIPE_CREWMATE_PRODUCT_ID:-}
      STRIPE_STARTER_PACK_EXPLORER_PRODUCT_ID: ${STRIPE_STARTER_PACK_EXPLORER_PRODUCT_ID:-}
      STRIPE_STARTER_PACK_STRATEGIST_PRODUCT_ID: ${STRIPE_STARTER_PACK_STRATEGIST_PRODUCT_ID:-}
      STRIPE_STARTER_PACK_INDUSTRIALIST_PRODUCT_ID: ${STRIPE_STARTER_PACK_INDUSTRIALIST_PRODUCT_ID:-}
      AVNU_PAYMASTER_ENABLED: ${AVNU_PAYMASTER_ENABLED:-0}
      AVNU_PAYMASTER_MAX_STARTER_PACK_BUDGET_STRK: ${AVNU_PAYMASTER_MAX_STARTER_PACK_BUDGET_STRK:-100}
      AVNU_PAYMASTER_RESERVATION_TTL_SECONDS: ${AVNU_PAYMASTER_RESERVATION_TTL_SECONDS:-300}
      AVNU_PAYMASTER_RATE_LIMIT_PER_MINUTE: ${AVNU_PAYMASTER_RATE_LIMIT_PER_MINUTE:-120}
      AVNU_PAYMASTER_REQUEST_TIMEOUT_MS: ${AVNU_PAYMASTER_REQUEST_TIMEOUT_MS:-10000}
      BANXA_CHECKOUT_ENABLED: ${BANXA_CHECKOUT_ENABLED:-0}
      BANXA_PARTNER_REF: ${BANXA_PARTNER_REF:-}
      BANXA_REQUEST_TIMEOUT_MS: ${BANXA_REQUEST_TIMEOUT_MS:-10000}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ARGENT_API_KEY_FILE:
      IPFS_RPC_URL: ${IPFS_RPC_URL:-}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-}
      IPFS_RPC_AUTHORIZATION_FILE:
      OPEN_SEA_API_KEY_FILE:
      SENDGRID_API_KEY_FILE:
      STRIPE_SECRET_KEY_FILE:
      STRIPE_WEBHOOK_SECRET_FILE:
      AVNU_PAYMASTER_API_KEY_FILE:
      BANXA_API_KEY_FILE:
      BANXA_WEBHOOK_API_KEY_FILE:
      BANXA_WEBHOOK_SECRET_FILE:
    secrets:
      - mongo_url
      - redis_url
      - elasticsearch_url
      - alchemy_influence_ethereum_http_url
      - jwt_secret
      - argent_api_key
      - ipfs_rpc_authorization
      - open_sea_api_key
      - sendgrid_api_key
      - stripe_secret_key
      - stripe_webhook_secret
      - avnu_paymaster_api_key
      - banxa_api_key
      - banxa_webhook_api_key
      - banxa_webhook_secret
    networks:
      - edge
      - data
      - outbound
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      juno:
        condition: service_started
    healthcheck:
      <<: *app-health
      test: ["CMD", "node", "bin/healthcheck.js", "api"]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: api

  influence-indexer:
    <<: *app-base
    command: ["node", "src/workers/elasticsearch.js"]
    environment:
      <<: *app-environment
      ELASTICSEARCH_INDEXER_RUN_DELAY: ${ELASTICSEARCH_INDEXER_RUN_DELAY:-1000}
    profiles: [indexer]
    healthcheck:
      <<: *app-health
      test: ["CMD", "node", "bin/healthcheck.js", "elastic-indexer"]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: elasticsearch-indexer

  influence-ethereum-event-retriever:
    <<: *app-base
    command: ["node", "src/workers/eventRetriever.js", "--eventSource=ethereum"]
    profiles: [indexer]
    healthcheck:
      <<: *app-health
      test: ["CMD", "node", "bin/healthcheck.js", "ethereum-retriever"]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: ethereum-event-retriever

  influence-starknet-event-retriever:
    <<: *app-base
    command: ["node", "src/workers/eventRetriever.js", "--eventSource=starknet"]
    environment:
      <<: *app-environment
      STARKNET_EVENT_RETRIEVER_RUN_DELAY: ${STARKNET_EVENT_RETRIEVER_RUN_DELAY:-2000}
    profiles: [indexer]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      juno:
        condition: service_started
    healthcheck:
      <<: *app-health
      test: ["CMD", "node", "bin/healthcheck.js", "starknet-retriever"]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: starknet-event-retriever

  influence-event-processor:
    <<: *app-base
    command: ["node", "src/workers/eventProcessor.js"]
    environment:
      <<: *app-environment
      ELEMENT_CHAIN: ${ELEMENT_CHAIN:-starknet}
      OPEN_SEA_API_KEY_FILE:
    secrets:
      - mongo_url
      - redis_url
      - elasticsearch_url
      - alchemy_influence_ethereum_http_url
      - open_sea_api_key
    profiles: [indexer]
    healthcheck:
      <<: *app-health
      test: ["CMD", "node", "bin/healthcheck.js", "event-processor"]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: event-processor

  influence-event-auditor:
    <<: *app-base
    command: ["node", "/opt/influence-stack/run-periodic.js", "${EVENT_AUDIT_INTERVAL_SECONDS:-3600}", "src/workers/eventAuditor.js"]
    volumes:
      - ./scripts/run-periodic.js:/opt/influence-stack/run-periodic.js:ro
    profiles: [auditor]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: event-auditor

  influence-agreement-auditor:
    <<: *app-base
    command: ["node", "/opt/influence-stack/run-periodic.js", "${AGREEMENT_AUDIT_INTERVAL_SECONDS:-3600}", "src/workers/agreementAudit.js"]
    volumes:
      - ./scripts/run-periodic.js:/opt/influence-stack/run-periodic.js:ro
    profiles: [auditor]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: agreement-auditor

  influence-notifications:
    <<: *app-base
    profiles: [notifications]
    command: ["node", "/opt/influence-stack/run-periodic.js", "${NOTIFICATIONS_INTERVAL_SECONDS:-60}", "src/workers/notifications.js"]
    environment:
      <<: *app-environment
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL}
      IMAGES_SERVER_URL: ${IMAGES_SERVER_URL:?Set IMAGES_SERVER_URL}
      SENDGRID_API_KEY_FILE:
      SENDGRID_TEMPLATE_NOTIFICATION: ${SENDGRID_TEMPLATE_NOTIFICATION:-}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-0}
      NOTIFICATIONS_EMAIL_FROM_EMAIL: ${NOTIFICATIONS_EMAIL_FROM_EMAIL:-}
      NOTIFICATIONS_EMAIL_FROM_NAME: ${NOTIFICATIONS_EMAIL_FROM_NAME:-Influence Notifications}
    secrets:
      - mongo_url
      - redis_url
      - elasticsearch_url
      - alchemy_influence_ethereum_http_url
      - sendgrid_api_key
    volumes:
      - ./scripts/run-periodic.js:/opt/influence-stack/run-periodic.js:ro
    labels:
      <<: *service-labels
      com.influenceth.stack.component: notifications

  influence-tools:
    <<: *app-base
    restart: "no"
    entrypoint: ["node"]
    profiles: [tools]
    labels:
      <<: *service-labels
      com.influenceth.stack.component: tools

  mongo-tools:
    image: ${MONGO_IMAGE:-mongo:7.0.41@sha256:8102f674c3d5b5c3b5a248397778b8d148a998c6409f390ff62628eb617f0847}
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-influence_admin}
      MONGO_DATABASE: ${MONGO_DATABASE:-influence}
      MONGO_RESTORE_SOURCE_DATABASE: ${MONGO_RESTORE_SOURCE_DATABASE:-influence}
    secrets:
      - mongo_root_password
    networks:
      - data
    profiles: [tools]
    logging: *default-logging
    labels:
      <<: *service-labels
      com.influenceth.stack.component: mongo-tools

networks:
  edge:
  data:
    internal: true
  outbound:

secrets:
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  mongo_url:
    file: ./secrets/mongo_url
  redis_password:
    file: ./secrets/redis_password
  redis_url:
    file: ./secrets/redis_url
  elasticsearch_password:
    file: ./secrets/elasticsearch_password
  elasticsearch_url:
    file: ./secrets/elasticsearch_url
  alchemy_juno_ethereum_ws_url:
    file: ./secrets/alchemy_juno_ethereum_ws_url
  alchemy_influence_ethereum_http_url:
    file: ./secrets/alchemy_influence_ethereum_http_url
  jwt_secret:
    file: ./secrets/jwt_secret
  argent_api_key:
    file: ./secrets/argent_api_key
  ipfs_rpc_authorization:
    file: ./secrets/ipfs_rpc_authorization
  open_sea_api_key:
    file: ./secrets/open_sea_api_key
  sendgrid_api_key:
    file: ./secrets/sendgrid_api_key
  stripe_secret_key:
    file: ./secrets/stripe_secret_key
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret
  avnu_paymaster_api_key:
    file: ./secrets/avnu_paymaster_api_key
  banxa_api_key:
    file: ./secrets/banxa_api_key
  banxa_webhook_api_key:
    file: ./secrets/banxa_webhook_api_key
  banxa_webhook_secret:
    file: ./secrets/banxa_webhook_secret
