services:
  influence-client:
    image: ${INFLUENCE_CLIENT_IMAGE:?Set INFLUENCE_CLIENT_IMAGE to a released digest}
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - ./client.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      REQUIRE_RUNTIME_CONFIG: "true"
      REACT_APP_CONFIG_ENV: production
      REACT_APP_API_INFLUENCE: https://${API_DOMAIN:?Set API_DOMAIN}
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (r.status !== 204) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
        labels: "com.docker.compose.service"
    labels:
      com.influenceth.stack.project: ${COMPOSE_PROJECT_NAME:-influence-production}
      com.influenceth.stack.component: client

  caddy:
    environment:
      CLIENT_DOMAIN: ${CLIENT_DOMAIN:?Set CLIENT_DOMAIN}
    volumes:
      - ./config/Caddyfile.client:/etc/caddy/client/site.caddy:ro
    depends_on:
      influence-client:
        condition: service_healthy
